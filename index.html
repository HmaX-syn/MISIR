<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 to MP4 Converter</title>
    <style>
        body {
            font-family: sans-serif;
            background: #121212;
            color: #eee;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        textarea {
            width: 100%;
            height: 150px;
            background: #1e1e1e;
            color: #0ff;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 4px;
            resize: vertical;
        }
        button {
            background: #00adb5;
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 10px;
            width: 100%;
        }
        button:hover {
            background: #00818a;
        }
        video {
            margin-top: 20px;
            width: 100%;
            border-radius: 4px;
            background: #000;
        }
    </style>
</head>
<body>

    <h2>Base64 - MP4 Oynatıcı ve Dönüştürücü</h2>
    <p>Base64 verisini aşağıdaki alana yapıştır:</p>
    
    <textarea id="base64Input" placeholder="Base64 metnini buraya yapıştır..."></textarea>
    <br>
    <button onclick="convertAndPlay()">Videoya Çevir & Oynat</button>
    
    <video id="videoPlayer" controls></video>

    <script>
        function convertAndPlay() {
            const b64 = document.getElementById('base64Input').value.trim();
            if (!b64) {
                alert('Lütfen geçerli bir Base64 metni gir!');
                return;
            }
            try {
                const byteCharacters = atob(b64);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: 'video/mp4' });
                const videoUrl = URL.createObjectURL(blob);
                
                const videoPlayer = document.getElementById('videoPlayer');
                videoPlayer.src = videoUrl;
                videoPlayer.play();
            } catch (e) {
                alert('Hata: Geçersiz Base64 formatı! ' + e.message);
            }
        }
    </script>

</body>
</html>
